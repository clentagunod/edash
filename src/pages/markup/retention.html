<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="page">
      <div class="page-header">
        <div>
          <h1>Retention</h1>
          <p class="desc">Place retained learners in the same grade in a configured succeeding school year.</p>
        </div>
      </div>
      <div id="yearSwitcherMount"></div>
      <div id="promotionAccessNotice" class="form-alert" role="status" aria-live="polite" hidden></div>
      <div class="stat-pill-row" id="promotionSummary"></div>
      <div class="toolbar profile-filters">
        <div class="search-box">
          <input id="promotionSearch" type="search" placeholder="Search learner or LRN..." />
        </div>
      </div>
      <section class="panel">
        <div class="panel-header"><h3>Retained learners</h3><span id="promotionResultCount" class="panel-meta"></span></div>
        <div style="overflow-x:auto;">
          <table class="data-table" style="min-width:800px;">
            <thead><tr><th>Learner ID</th><th>Name</th><th>Current Grade &amp; Section</th><th>Age</th><th>EOSY Status</th><th>Action</th></tr></thead>
            <tbody id="promotionTableBody"><tr><td colspan="6" class="state-row">Loading retained learners…</td></tr></tbody>
          </table>
        </div>
      </section>
      <div class="pagination"><span id="promotionPageInfo">-</span><div class="pager-btns" id="promotionPagerBtns"></div></div>
    </main>
  </div>
</div>
